name: Build Batch Renamer Pro

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter Pillow pyinstaller darkdetect

    - name: Create EXE with Icon
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon="my_icon.ico" --name "BatchRenamerPro" script.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Final-Windows-Tool
        path: dist/BatchRenamerPro.exe
