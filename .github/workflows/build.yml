name: Build Windows Exe
on: [push] 

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install customtkinter pyinstaller

      - name: Build Exe
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter test2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FileSearcher-Windows
          path: dist/test2.exe
