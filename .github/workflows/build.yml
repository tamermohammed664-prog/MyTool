name: Build Standalone Executable

on:
  workflow_dispatch: # يتيح التشغيل اليدوي المباشر من تبويب Actions
  push:
    branches:
      - main # يشتغل تلقائياً عند أي Push على فرع main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter opencv-python PyMuPDF numpy pyzbar

    - name: Build with PyInstaller (onefile)
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon="my_icon.ico" --add-data "my_icon.ico;." qr_renamer.py

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QR_Renamer_Executable
        path: dist/qr_renamer.exe

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/qr_renamer.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
