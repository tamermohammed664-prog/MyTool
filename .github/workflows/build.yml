name: Build Batch Renamer Pro

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable (Single File)
      run: |
        pyinstaller --noconfirm --onefile --windowed --collect-all torchvision --name "SmartRenamer" smart_renamer.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartRenamer-Windows
        path: dist/SmartRenamer.exe
