name: Build Smart Renamer Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download EasyOCR Models for Offline Use
      run: |
        mkdir -p easyocr_models
        curl -L -o easyocr_models/craft_mlt_25_2020.pth https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/craft_mlt_25_2020.pth
        curl -L -o easyocr_models/english_g2.pth https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/english_g2.pth
        curl -L -o easyocr_models/arabic_g2.pth https://github.com/JaidedAI/EasyOCR/releases/download/v1.3/arabic_g2.pth

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed `
          --add-data "easyocr_models;easyocr_models" `
          --collect-all easyocr `
          --collect-all customtkinter `
          --name "SmartRenamer" `
          main.py

    - name: Archive Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SmartRenamer-Windows
        path: dist/SmartRenamer/
