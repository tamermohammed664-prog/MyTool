name: Build Single Directory Executable

on:
  workflow_dispatch: # يتيح التشغيل اليدوي المباشر من الواجهة
  push:
    branches:
      - main # يشتغل تلقائياً عند أي Push على فرع main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter opencv-python PyMuPDF numpy

    - name: Build with PyInstaller (onedir)
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="my_icon.ico" --add-data "my_icon.ico;." qr_renamer.py

    - name: Compress Build Output
      run: |
        powershell Compress-Archive -Path dist/qr_renamer/* -DestinationPath QR_Renamer_Windows.zip

    - name: Upload Artifact (تحميل مباشر من الـ Actions)
      uses: actions/upload-artifact@v4
      with:
        name: QR_Renamer_Windows
        path: QR_Renamer_Windows.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: QR_Renamer_Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
