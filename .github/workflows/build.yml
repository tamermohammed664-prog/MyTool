name: Build Turbo File Searcher V2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pillow pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --collect-all customtkinter --icon=my_icon.ico test2.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: File-Searcher-Final-Compact
        path: dist/test2.exe
