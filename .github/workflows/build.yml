name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        python -m pip install easyocr
        python -m pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: |
        if (!(Test-Path ".smart_renamer_rois.json")) { "{}" | Out-File -Encoding utf8 .smart_renamer_rois.json }
        pyinstaller --noconfirm --onefile --windowed --add-data ".smart_renamer_rois.json;." smart_renamer.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartRenamer-EXE
        path: dist/smart_renamer.exe
